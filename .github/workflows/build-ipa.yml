name: Build IPA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build a full or enhanced ipa'
        required: true
        type: choice
        options:
          - full
          - enhanced
        default: full

      description:
        description: 'Run description'
        required: false
        type: string
        default: 'Build IPA'

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Nuvio for iOS and iPadOS
    runs-on: macos-14
    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch iOS Specific Submodule
        run: git submodule update --init --recursive MPVKit

      - name: Patch MPVKit Package.swift for CI (replace local path targets with remote URLs)
        run: |
          cd MPVKit
          python3 - << 'PYEOF'
          import re

          replacements = {
              "Libplacebo": (
                  "https://github.com/mpvkit/libplacebo-build/releases/download/7.360.1/Libplacebo.xcframework.zip",
                  "2fa3d54cb81f302d6f11c7b2f509af30944381c3b11ee9d35096eb4637a6e2dd"
              ),
              "Libavcodec": (
                  "https://github.com/mpvkit/MPVKit/releases/download/1.0.0/Libavcodec.xcframework.zip",
                  "136e432919a8a7b5b80155c68e9dc91b0ef3ae6623970b87bb8bd96a452543cf"
              ),
              "Libavdevice": (
                  "https://github.com/mpvkit/MPVKit/releases/download/1.0.0/Libavdevice.xcframework.zip",
                  "65713615f53352b37baffb38c5b88d88bab647d050d999bcc4684344ab636bdf"
              ),
              "Libavformat": (
                  "https://github.com/mpvkit/MPVKit/releases/download/1.0.0/Libavformat.xcframework.zip",
                  "2afb601375929640e743e7bdaa6c4a88e2b582a07e1c5f2dc95cc7f5b26a0810"
              ),
              "Libavfilter": (
                  "https://github.com/mpvkit/MPVKit/releases/download/1.0.0/Libavfilter.xcframework.zip",
                  "3e71af8633d99d365f14b88064bceafd57acb23fc64db90e55b715a9c0dca328"
              ),
              "Libavutil": (
                  "https://github.com/mpvkit/MPVKit/releases/download/1.0.0/Libavutil.xcframework.zip",
                  "5dc251c8807c501982edfb0bc9bddfee4148733142d6ebb947738c60fb3bf8d8"
              ),
              "Libswresample": (
                  "https://github.com/mpvkit/MPVKit/releases/download/1.0.0/Libswresample.xcframework.zip",
                  "d5c36acf2ff944e15706f4b7bfbf18bb1993ffc5b446c9f67f1aa79de5441f15"
              ),
              "Libswscale": (
                  "https://github.com/mpvkit/MPVKit/releases/download/1.0.0/Libswscale.xcframework.zip",
                  "4fc00de6a7a8cddcdfe0eeb73b4f919cfaf9a0fd5a442f42a43e0f56e157d7c5"
              ),
              "Libmpv": (
                  "https://github.com/mpvkit/MPVKit/releases/download/1.0.0/Libmpv.xcframework.zip",
                  "c381ceb4c1504efac12da95293e56585bbeb691634aa64e3a729f517169933ba"
              ),
          }

          with open("Package.swift", "r") as f:
              content = f.read()

          for name, (url, checksum) in replacements.items():
              pattern = (
                  r'(\.binaryTarget\(\s*\n\s*name:\s*"' + re.escape(name) + r'",\s*\n)'
                  r'\s*path:\s*"[^"]+"\s*\n'
                  r'(\s*\))'
              )
              replacement = (
                  r'\g<1>'
                  f'            url: "{url}",\n'
                  f'            checksum: "{checksum}"\n'
                  r'\g<2>'
              )
              new_content, count = re.subn(pattern, replacement, content)
              if count:
                  print(f"✓ Patched {name}")
                  content = new_content
              else:
                  print(f"  (skipped {name} — already url-based or not found)")

          with open("Package.swift", "w") as f:
              f.write(content)

          print("\nDone.")
          PYEOF

      - name: Select Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Nuvio Engine Apple XCFramework
        env:
          NUVIO_ENGINE_VERSION: 0.1.1
        run: |
          set -euo pipefail

          ENGINE_ROOT="../nuvio-engine/platform/apple"
          ENGINE_DEST="${ENGINE_ROOT}/NuvioEngine.xcframework"
          ARCHIVE="${RUNNER_TEMP}/nuvio-engine-apple-${NUVIO_ENGINE_VERSION}.zip"
          EXTRACT_DIR="${RUNNER_TEMP}/nuvio-engine-apple-${NUVIO_ENGINE_VERSION}"

          rm -rf "${ENGINE_ROOT}" "${EXTRACT_DIR}" "${ARCHIVE}"
          mkdir -p "${ENGINE_ROOT}" "${EXTRACT_DIR}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            "https://github.com/NuvioMedia/nuvio-engine/releases/download/v${NUVIO_ENGINE_VERSION}/nuvio-engine-apple-${NUVIO_ENGINE_VERSION}.zip" \
            --output "${ARCHIVE}"

          ditto -x -k "${ARCHIVE}" "${EXTRACT_DIR}"

          XCFRAMEWORK="$(find "${EXTRACT_DIR}" -type d -name NuvioEngine.xcframework -print -quit)"
          if [[ -z "${XCFRAMEWORK}" ]]; then
            echo "::error::NuvioEngine.xcframework was not found in the downloaded archive."
            find "${EXTRACT_DIR}" -maxdepth 4 -print
            exit 1
          fi

          ditto "${XCFRAMEWORK}" "${ENGINE_DEST}"

          for SLICE in ios-arm64 ios-arm64_x86_64-simulator; do
            SLICE_DIR="${ENGINE_DEST}/${SLICE}"

            test -f "${SLICE_DIR}/libCNuvioEngine.a" || {
              echo "::error::Missing ${SLICE_DIR}/libCNuvioEngine.a"
              exit 1
            }

            test -f "${SLICE_DIR}/Headers/nuvio_engine/nuvio_engine.h" || {
              echo "::error::Missing ${SLICE_DIR}/Headers/nuvio_engine/nuvio_engine.h"
              exit 1
            }
          done

          echo "Nuvio Engine Apple XCFramework installed at ${ENGINE_DEST}"
          find "${ENGINE_DEST}" -maxdepth 4 -type f -print

      - name: Generate local.properties & gradle.properties
        run: |
          cat << 'EOF' > local.properties
          NUVIO_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI=${{ secrets.TRAKT_REDIRECT_URI }}
          SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET=${{ secrets.SIMKL_CLIENT_SECRET }}
          SIMKL_REDIRECT_URI=${{ secrets.SIMKL_REDIRECT_URI }}
          PREMIUMIZE_CLIENT_ID=${{ secrets.PREMIUMIZE_CLIENT_ID }}
          PREMIUMIZE_CLIENT_SECRET=${{ secrets.PREMIUMIZE_CLIENT_SECRET }}
          PREMIUMIZE_REDIRECT_URI=${{ secrets.PREMIUMIZE_REDIRECT_URI }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          INTRODB_API_URL=${{ secrets.INTRODB_API_URL }}
          CONTRIBUTIONS_URL=${{ secrets.CONTRIBUTIONS_URL }}
          DONATIONS_BASE_URL=${{ secrets.DONATIONS_BASE_URL }}
          DONATIONS_DONATE_URL=${{ secrets.DONATIONS_DONATE_URL }}
          DIRECT_DEBRID_API_BASE_URL=${{ secrets.DIRECT_DEBRID_API_BASE_URL }}
          NUVIO_IOS_DISTRIBUTION=full
          EOF

          cat >> gradle.properties << 'EOF'
          kotlin.native.cacheKind=none
          kotlin.native.cacheKind.iosArm64=none
          kotlin.native.cacheKind.iosSimulatorArm64=none
          EOF

      - name: Restore iOS build caches
        id: ios-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
            ~/Library/Caches/org.swift.swiftpm
            iosApp/build/SourcePackages
          key: ${{ runner.os }}-ios-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'MPVKit/Package.swift', 'iosApp/iosApp.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-ios-

      - name: Build iOS App via Xcode
        run: |
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Save iOS build caches
        if: always() && steps.ios-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
            ~/Library/Caches/org.swift.swiftpm
            iosApp/build/SourcePackages
          key: ${{ steps.ios-cache.outputs.cache-primary-key }}

      - name: Set artifact suffix
        run: |
          if [ "${{ inputs.mode }}" = "full" ]; then
            echo "BUILD_SUFFIX=Full" >> $GITHUB_ENV
          else
            echo "BUILD_SUFFIX=Enhanced" >> $GITHUB_ENV
          fi

      - name: Package App into .ipa
        id: package
        run: |
          cd iosApp/build/Build/Products/Release-iphoneos
          APP_DIR=$(ls -d *.app | head -n 1)
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_DIR/Info.plist")
          mkdir Payload
          mv "$APP_DIR" Payload/
          IPA_NAME="Nuvio-v${APP_VERSION}-${BUILD_SUFFIX}.ipa"
          zip -q -r "$IPA_NAME" Payload
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV
          echo "ipa_path=iosApp/build/Build/Products/Release-iphoneos/${IPA_NAME}" >> $GITHUB_OUTPUT
          echo "version=${APP_VERSION}" >> $GITHUB_OUTPUT

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-iOS-${{ env.BUILD_SUFFIX }}
          path: iosApp/build/Build/Products/Release-iphoneos/${{ env.IPA_NAME }}

      - name: Publish Release to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          IPA_FILE: ${{ steps.package.outputs.ipa_path }}
        run: |
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists. Uploading IPA..."
            gh release upload "${TAG}" "${IPA_FILE}" --clobber
          else
            echo "Creating new release ${TAG}..."
            gh release create "${TAG}" "${IPA_FILE}" \
              --title "Nuvio Enhanced iOS ${TAG}" \
              --notes "Release of Nuvio Enhanced iOS ${TAG}"
          fi

      - name: Update SideStore / AltStore Community Source JSON
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          IPA_NAME: ${{ env.IPA_NAME }}
          BUILD_SUFFIX: ${{ env.BUILD_SUFFIX }}
        run: |
          python3 - << 'PYEOF'
          import json, os, datetime

          version = os.environ.get('VERSION', '0.4.11')
          ipa_name = os.environ.get('IPA_NAME', 'Nuvio-v0.4.11-Enhanced.ipa')
          suffix = os.environ.get('BUILD_SUFFIX', 'Enhanced')
          repo = os.environ.get('GITHUB_REPOSITORY', 'illuminati945/NuvioMobile-iOS')

          json_file = f"Nuvio{suffix}.json"
          if not os.path.exists(json_file):
              json_file = "NuvioEnhanced.json"

          ipa_path = f"iosApp/build/Build/Products/Release-iphoneos/{ipa_name}"
          size = os.path.getsize(ipa_path) if os.path.exists(ipa_path) else 61274439

          download_url = f"https://github.com/{repo}/releases/download/v{version}/{ipa_name}"
          now_iso = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          with open(json_file, 'r', encoding='utf-8') as f:
              data = json.load(f)

          if data.get("apps") and len(data["apps"]) > 0:
              app = data["apps"][0]
              if not app.get("versions"):
                  app["versions"] = []
              ver_entry = {
                  "version": version,
                  "buildVersion": "115",
                  "date": now_iso,
                  "localizedDescription": f"# 🚀 Nuvio {suffix} iOS v{version}\n\n- Latest upstream enhancements & fixes\n- SideStore and AltStore community source support\n- Automated GitHub Actions compilation\n- Live TV and M3U EPG integration\n- Subtitle styling and language grouping\n- Performance and memory stability improvements",
                  "downloadURL": download_url,
                  "size": size,
                  "minOSVersion": "16.0"
              }
              app["versions"] = [ver_entry]

          with open(json_file, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)

          print(f"Updated {json_file} with downloadURL: {download_url} ({size} bytes)")
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NuvioEnhanced.json NuvioFull.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update SideStore source metadata for v${VERSION} [skip ci]" && git push)

      - name: Send Discord Release Notification
        if: always() && steps.package.outcome == 'success'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERSION: ${{ steps.package.outputs.version }}
          IPA_NAME: ${{ env.IPA_NAME }}
        run: |
          python3 - << 'PYEOF'
          import urllib.request, json, os

          webhook_url = os.environ.get('DISCORD_WEBHOOK', '')
          if not webhook_url:
              exit(0)

          version = os.environ.get('VERSION', '0.4.11')
          ipa_name = os.environ.get('IPA_NAME', 'Nuvio.ipa')
          repo = os.environ.get('GITHUB_REPOSITORY', 'illuminati945/NuvioMobile-iOS')

          payload = {
              'username': 'Nuvio iOS Release',
              'embeds': [{
                  'title': f'🎉 Nuvio Enhanced iOS v{version} Released!',
                  'description': f'A new iOS IPA package has been compiled and published to GitHub Releases.',
                  'color': 3066993,
                  'fields': [
                      {'name': '📦 Package', 'value': f'`{ipa_name}`', 'inline': True},
                      {'name': '🏷️ Release Tag', 'value': f'`v{version}`', 'inline': True},
                      {'name': '⬇️ Download Link', 'value': f'[Download IPA from Releases](https://github.com/{repo}/releases/tag/v{version})', 'inline': False},
                      {'name': '📲 SideStore Source', 'value': f'`https://raw.githubusercontent.com/{repo}/main/NuvioEnhanced.json`', 'inline': False}
                  ],
                  'footer': {'text': 'Nuvio Enhanced iOS Auto-Builder'}
              }]
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json', 'User-Agent': 'DiscordBot'},
              method='POST'
          )
          try:
              urllib.request.urlopen(req)
              print('Discord notification sent successfully!')
          except Exception as e:
              print('Discord notification error:', e)
          PYEOF
