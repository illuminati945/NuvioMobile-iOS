name: Update AltStore & SideStore Sources

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Specific release tag to parse (leave empty for latest release)'
        required: false
        type: string
        default: ''
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: update-altstore-sources
  cancel-in-progress: false

env:
  SOURCE_REPO: ${{ github.repository }}

jobs:
  update-sources:
    name: Update SideStore/AltStore JSON Sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Current Branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update AltStore & SideStore Sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - << 'PY'
          import io
          import json
          import os
          import plistlib
          import re
          import sys
          import time
          import urllib.request
          import zipfile
          from pathlib import Path

          REPO = os.environ["SOURCE_REPO"]
          EVENT_NAME = os.environ.get("EVENT_NAME", "")
          RELEASE_ID = os.environ.get("RELEASE_ID", "").strip()
          INPUT_TAG = os.environ.get("INPUT_TAG", "").strip()

          SOURCES = {
              "Enhanced": {
                  "path": Path("NuvioEnhanced.json"),
                  "asset_pattern": re.compile(r"^.*(Enhanced|ipa).*$", re.IGNORECASE),
                  "fallback_priority": 1,
              },
              "Full": {
                  "path": Path("NuvioFull.json"),
                  "asset_pattern": re.compile(r"^.*Full.*\.ipa$", re.IGNORECASE),
                  "fallback_priority": 2,
              },
          }

          API_HEADERS = {
              "User-Agent": "nuvio-altstore-updater",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          token = os.environ.get("GITHUB_TOKEN")
          if token:
              API_HEADERS["Authorization"] = f"Bearer {token}"

          def request_json(url):
              req = urllib.request.Request(url, headers=API_HEADERS)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          def download_asset(asset):
              headers = dict(API_HEADERS)
              headers["Accept"] = "application/octet-stream"
              req = urllib.request.Request(asset["url"], headers=headers)
              with urllib.request.urlopen(req, timeout=600) as response:
                  return response.read()

          def get_release():
              if EVENT_NAME == "release" and RELEASE_ID:
                  url = f"https://api.github.com/repos/{REPO}/releases/{RELEASE_ID}"
              elif INPUT_TAG:
                  url = f"https://api.github.com/repos/{REPO}/releases/tags/{INPUT_TAG}"
              else:
                  url = f"https://api.github.com/repos/{REPO}/releases/latest"

              print(f"Fetching release from {url}...")
              release = request_json(url)

              if release.get("draft"):
                  print("Warning: Release is marked as draft.")
              return url, release

          def find_ipa_assets(release):
              assets = release.get("assets", [])
              ipa_assets = [a for a in assets if a.get("name", "").endswith(".ipa")]
              return ipa_assets

          def inspect_ipa(data):
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  plist_paths = [
                      name for name in archive.namelist()
                      if re.fullmatch(r"Payload/[^/]+\.app/Info\.plist", name)
                  ]
                  if not plist_paths:
                      sys.exit("Expected at least one main app Info.plist in Payload.")

                  plist = plistlib.loads(archive.read(plist_paths[0]))

              metadata = {
                  "bundleIdentifier": plist.get("CFBundleIdentifier") or "com.nuvio.enhanced",
                  "version": plist.get("CFBundleShortVersionString") or "0.4.11",
                  "buildVersion": plist.get("CFBundleVersion") or "1",
                  "minOSVersion": plist.get("MinimumOSVersion") or "16.0",
              }
              return {k: str(v) if v is not None else None for k, v in metadata.items()}

          def update_source_file(source_path, release, asset, metadata, variant_name):
              if not source_path.exists():
                  print(f"Skipping {source_path} (does not exist)")
                  return False

              with source_path.open("r", encoding="utf-8") as f:
                  source = json.load(f)

              apps = source.get("apps", [])
              if not apps:
                  print(f"No apps found in {source_path}")
                  return False

              app = apps[0]
              app["bundleIdentifier"] = metadata["bundleIdentifier"]

              version = metadata["version"]
              build_version = metadata["buildVersion"]
              download_url = asset.get("browser_download_url") or f"https://github.com/{REPO}/releases/download/{release.get('tag_name')}/{asset.get('name')}"
              size = int(asset.get("size") or 0)
              published_date = release.get("published_at") or time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
              notes = (release.get("body") or "").strip()
              if not notes:
                  notes = f"# 🚀 Nuvio {variant_name} v{version}\n\nAutomated release build."

              entry = {
                  "version": version,
                  "buildVersion": build_version,
                  "date": published_date,
                  "localizedDescription": notes[:3000],
                  "downloadURL": download_url,
                  "size": size,
                  "minOSVersion": metadata.get("minOSVersion", "16.0")
              }

              existing_versions = app.get("versions", [])
              # Filter out existing entries with exact same version and buildVersion
              filtered_versions = [
                  v for v in existing_versions
                  if not (v.get("version") == version and v.get("buildVersion") == build_version)
              ]
              app["versions"] = [entry] + filtered_versions

              # Update website and icon URLs if they contain generic placeholders
              if "github.com" in source.get("website", "") and not "/" in source.get("website", "").replace("https://github.com/", ""):
                  source["website"] = f"https://github.com/{REPO}"

              with source_path.open("w", encoding="utf-8") as f:
                  json.dump(source, f, indent=2, ensure_ascii=False)
                  f.write("\n")

              print(f"✓ Updated {source_path} with version {version} (build {build_version})")
              return True

          url, release = get_release()
          ipa_assets = find_ipa_assets(release)

          if not ipa_assets:
              print("No .ipa assets found in release. Waiting 30s in case build is finishing...")
              time.sleep(30)
              url, release = get_release()
              ipa_assets = find_ipa_assets(release)

          if not ipa_assets:
              print("No .ipa assets found in release. Exiting gracefully.")
              sys.exit(0)

          print(f"Found {len(ipa_assets)} IPA asset(s): {[a['name'] for a in ipa_assets]}")

          changed = False
          for asset in ipa_assets:
              name = asset["name"]
              print(f"Processing {name}...")
              blob = download_asset(asset)
              meta = inspect_ipa(blob)
              print(f"Metadata: {meta}")

              if "full" in name.lower():
                  changed |= update_source_file(Path("NuvioFull.json"), release, asset, meta, "Full")
              else:
                  changed |= update_source_file(Path("NuvioEnhanced.json"), release, asset, meta, "Enhanced")

          print(f"Source updates completed. Changed: {changed}")
          PY

      - name: Commit and Push Updated Sources
        run: |
          if git diff --quiet -- NuvioFull.json NuvioEnhanced.json; then
            echo "No changes to SideStore/AltStore source JSON files."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add NuvioFull.json NuvioEnhanced.json
          git commit -m "chore(sources): update SideStore & AltStore sources [skip ci]"
          git push origin HEAD || git push origin main || git push origin enhanced || true
          echo "Successfully pushed updated sources."
